[project]
name = "assessment-bot"
description = "Backend for a Discord bot to store assessments of different pieces of art (movies, series, books, etc.)."
version = "0.1.0"
requires-python = ">=3.13,<3.14"
readme = "README.md"
dependencies = [
    "django==5.2.17",
    "starlette==1.10.0",
    "django-environ==0.14.0",
    "discord.py==2.7.1",
    "mcp==2.3.0",
    "pyrankvote==2.0.6",
    "numpy==2.5.1",
    "sentry-sdk==2.66.1",
    "psycopg[binary]==3.3.4",
    "httpx2==2.16.0",
    "gunicorn",
    "uvicorn[standard]",
    "uvicorn-worker",
    "poethepoet==0.48.0",
]

[dependency-groups]
dev = [
    "factory-boy==3.3.3",
    "coverage",
    "ruff==0.16.0",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/tests.py",
    "*/migrations/*",
    "core/asgi.py",
    "core/wsgi.py",
    "manage.py",
]

[tool.coverage.report]
exclude_also = [
    "if 0:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.poe]
executor = "simple"

[tool.poe.envfile]
optional = [".env"]

[tool.poe.tasks.start]
cmd = "gunicorn -c .box/etc/gunicorn.py -k uvicorn_worker.UvicornWorker core.asgi:application"
use_exec = true

[tool.poe.tasks.start-dev]
cmd = "uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --reload"
use_exec = true

[tool.poe.tasks.start-bot]
cmd = "./manage.py start_bot"
use_exec = true

[tool.poe.tasks.start-dev-bot]
cmd = "./manage.py start_bot"
use_exec = true

[tool.poe.tasks.build]
cmd = "./manage.py collectstatic --no-input"

[tool.poe.tasks.build-dev]
cmd = "./manage.py migrate --no-input"

[tool.poe.tasks.test]
shell = """
    coverage run ./manage.py test --no-input
    code=$?
    coverage report -m
    exit $code
"""

[tool.poe.tasks.format]
shell = """
    ruff check --fix
    code=$?
    ruff format
    exit $code
"""

[tool.poe.tasks.migrate]
cmd = "./manage.py migrate --no-input"

[tool.ruff]
line-length = 120
show-fixes = true
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B", "SIM", "I", "D4", "TID252"]

[tool.ruff.lint.isort]
case-sensitive = true
section-order = ["django", "third-party", "future", "standard-library", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"django" = ["django"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
